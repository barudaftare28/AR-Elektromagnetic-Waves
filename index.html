<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EM WAVE LAB - Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/page1.css" />
    <link rel="stylesheet" href="css/page2.css" />
    <link rel="stylesheet" href="css/page3.css" />
    <link rel="stylesheet" href="css/page4.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="logo">
        <svg class="pulse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
        </svg>
        <div class="logo-text">
          <h1>EM WAVE LAB</h1>
          <p data-i18n="logo_sub">Eksplorasi. Eksperimen. Pahami.</p>
        </div>
      </div>

      <nav class="nav-links">
        <button class="nav-btn active" data-goto="1"><span class="badge">1</span> <span data-i18n="nav_intro">Intro</span></button>
        <button class="nav-btn" data-goto="2"><span class="badge">2</span> <span data-i18n="nav_lab">Wave Lab</span></button>
        <button class="nav-btn" data-goto="3"><span class="badge">3</span> <span data-i18n="nav_spec">Spectrum (AR)</span></button>
        <button class="nav-btn" data-goto="4"><span class="badge">4</span> <span data-i18n="nav_challenge">Challenge</span></button>
      </nav>

      <div class="top-actions">
        <button class="action-btn" data-modal-open="modal-panduan"><span>?</span> <span data-i18n="btn_guide">Panduan</span></button>
        <button class="action-btn" data-modal-open="modal-glosarium"><span>📖</span> <span data-i18n="btn_glossary">Glosarium</span></button>
        <button class="action-btn" data-modal-open="modal-pengaturan"><span>⚙️</span> <span data-i18n="btn_settings">Pengaturan</span></button>
      </div>
    </header>

    <!-- MODALS -->
    <div id="modal-panduan" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3>? <span data-i18n="modal_guide_title">Panduan Penggunaan</span></h3>
          <button class="close-btn" data-modal-close>✕</button>
        </div>
        <div class="modal-body">
          <p><strong data-i18n="modal_guide_p1">Page 1 (Intro):</strong> <span data-i18n="modal_guide_d1"></span></p>
          <p><strong data-i18n="modal_guide_p2">Page 2 (Wave Lab):</strong> <span data-i18n="modal_guide_d2"></span></p>
          <p><strong data-i18n="modal_guide_p3">Page 3 (Spectrum):</strong> <span data-i18n="modal_guide_d3"></span></p>
          <p><strong data-i18n="modal_guide_p4">Page 4 (Challenge):</strong> <span data-i18n="modal_guide_d4"></span></p>
        </div>
      </div>
    </div>

    <div id="modal-glosarium" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3>📖 <span data-i18n="btn_glossary">Glosarium</span></h3>
          <button class="close-btn" data-modal-close>✕</button>
        </div>
        <div class="modal-body">
          <ul>
            <li><strong data-i18n="glo_freq_title">Frekuensi (f):</strong> <span data-i18n="glo_freq_desc"></span></li>
            <li><strong data-i18n="glo_wave_title">Panjang Gelombang (λ):</strong> <span data-i18n="glo_wave_desc"></span></li>
            <li><strong data-i18n="glo_amp_title">Amplitudo (A):</strong> <span data-i18n="glo_amp_desc"></span></li>
          </ul>
        </div>
      </div>
    </div>

    <div id="modal-pengaturan" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3>⚙️ <span data-i18n="btn_settings">Pengaturan</span></h3>
          <button class="close-btn" data-modal-close>✕</button>
        </div>
        <div class="modal-body settings-body">
          <div class="setting-item">
            <div>
              <strong data-i18n="set_lang">Bahasa / Language</strong>
              <p class="text-sm" data-i18n="set_lang_desc"></p>
            </div>
            <button class="toggle-btn" id="btn-lang">ID</button>
          </div>
          <div class="setting-item">
            <div>
              <strong data-i18n="set_theme">Tema Tampilan</strong>
              <p class="text-sm" data-i18n="set_theme_desc"></p>
            </div>
            <button class="toggle-btn" id="btn-theme">🌙 Dark</button>
          </div>
          <div class="setting-item">
            <div>
              <strong data-i18n="set_perf">Kualitas Animasi</strong>
              <p class="text-sm" data-i18n="set_perf_desc"></p>
            </div>
            <button class="toggle-btn" id="btn-fps">60 FPS</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Page 1-4 dimuat otomatis dari folder pages/ -->
    <main id="app"></main>

    <script type="module" src="js/Main/app.js"></script>
  </body>
</html>
