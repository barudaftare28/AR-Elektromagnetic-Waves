<!-- PAGE 3: SPECTRUM (AR) — memakai kelas desain Page 2 -->
<section id="page-3" class="page">
  <div class="container container-p2">

    <div class="p2-header">
      <div class="tag-header no-margin">
        <span class="tag bg-blue">PAGE 3</span>
        <div>
          <h2 class="p2-title">SPECTRUM</h2>
          <p class="p2-subtitle" data-i18n="p3_sub"></p>
        </div>
      </div>
    </div>

    <!-- BOX 1: PETA SPEKTRUM -->
    <article class="p2-box" id="box-map">
      <h3 class="p2-box-title cyan-text" data-i18n="p3_map"></h3>
      <h4 class="text-sm" data-i18n="p3_map_hint"></h4>
      <div class="spec-map" id="spec-map"><div class="spec-mark" id="spec-mark"></div></div>
      <div class="p3-arrows"><span data-i18n="p3_lo"></span><span data-i18n="p3_hi"></span></div>
    </article>

    <!-- BOX 2: SIMULASI -->
    <article class="p2-box" id="box-spec">
      <div class="canvas-header">
        <h3 class="p2-box-title" data-i18n="p3_title"></h3>
        <div class="tooltip-container">
          <span class="icon-info" tabindex="0">i</span>
          <div class="tooltip" data-i18n="p3_tt"></div>
        </div>
      </div>

      <div class="wave-toolbar">
        <div class="wave-tabs" role="group">
          <button type="button" class="wave-tab active" data-mode="one" aria-pressed="true" data-i18n="p3_mode1"></button>
          <button type="button" class="wave-tab" data-mode="cmp" aria-pressed="false" data-i18n="p3_mode2"></button>
        </div>
        <span class="toolbar-sep" aria-hidden="true"></span>
        <div class="toolbar-actions">
          <button id="btn-p3-reset" class="btn-outline btn-sm">🔄 <span data-i18n="p3_reset"></span></button>
          <button id="btn-p3-pause" class="btn-outline btn-sm"><span id="p3-pause-icon">⏸</span> <span id="p3-pause-label"></span></button>
        </div>
      </div>

      <div class="cmp-bar" id="cmp-bar" hidden>
        <label><span data-i18n="p3_cmpA"></span><select id="sel-a"></select></label>
        <label><span data-i18n="p3_cmpB"></span><select id="sel-b"></select></label>
        <button type="button" class="btn-outline btn-sm" id="btn-extreme" data-i18n="p3_extreme"></button>
      </div>

      <div class="wave-grid">
        <div class="wave-main">
          <div class="canvas-wrapper" id="wrap-a">
            <canvas id="spectrum-canvas" aria-hidden="true"></canvas>
          </div>

          <div class="canvas-wrapper" id="wrap-b" hidden>
            <canvas id="spectrum-canvas-b" aria-hidden="true"></canvas>
          </div>

          <div class="wave-controls">
            <div class="wave-sliders">
              <div class="sim-control stack" id="box-freq">
                <label for="slider-freq" data-i18n="p3_freq"></label>
                <output id="val-f" for="slider-freq">--</output>
                <div class="step-row">
                  <button type="button" class="step-btn" id="btn-f-minus">−</button>
                  <input type="range" id="slider-freq" class="p2-slider accent-cyan" min="0" max="7" step="any" value="0" />
                  <button type="button" class="step-btn" id="btn-f-plus">+</button>
                </div>
              </div>
              <div class="sim-control stack">
                <label for="slider-amp" data-i18n="p3_amp"></label>
                <output id="val-a" for="slider-amp">5.00 m</output>
                <div class="step-row">
                  <button type="button" class="step-btn" id="btn-a-minus">−</button>
                  <input type="range" id="slider-amp" class="p2-slider accent-orange" min="0" max="10" step="0.1" value="5" />
                  <button type="button" class="step-btn" id="btn-a-plus">+</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="wave-side" id="side-one">
          <div class="values-card dynamic-card">
            <h4 class="mb-4"><span data-i18n="p3_info"></span> 📡</h4>
            <div class="info-grid">
              <div class="value-item">
                <span class="val-number sm" id="info-name">--</span>
                <span class="val-sub" id="info-range">--</span>
              </div>
              <div class="value-item"><span class="val-label" data-i18n="p3_freq"></span><span class="val-number sm cyan-text" id="info-freq">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_lambda"></span><span class="val-number sm purple-text" id="info-lambda">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_energy"></span><span class="val-number sm" id="info-energy">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_amp"></span><span class="val-number sm" id="info-amp">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_speed"></span><span class="val-number sm">3.00 × 10⁸ <span class="val-unit">m/s</span></span></div>
            </div>
          </div>
        </div>


        <div class="wave-side" id="side-cmp" hidden>

          <!-- Kartu A -->
          <div class="values-card dynamic-card">
            <h4 class="mb-4"><span data-i18n="p3_info"></span> · A 📡</h4>
            <div class="info-grid">
              <div class="value-item">
                <span class="val-label" data-i18n="p3_type"></span>
                <span class="val-number sm" id="ca-name">--</span>
                <span class="val-sub" id="ca-range">--</span>
              </div>
              <div class="value-item"><span class="val-label" data-i18n="p3_freq"></span><span class="val-number sm cyan-text" id="ca-f">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_lambda"></span><span class="val-number sm purple-text" id="ca-l">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_energy"></span><span class="val-number sm" id="ca-e">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_amp"></span><span class="val-number sm" id="ca-a">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_speed"></span><span class="val-number sm">3.00 × 10⁸ <span class="val-unit">m/s</span></span></div>
            </div>
          </div>

          <!-- Kartu B: salin kartu A, ganti "A 📡" menjadi "B 📡" dan semua id "ca-" menjadi "cb-" -->
           <div class="values-card dynamic-card">
            <h4 class="mb-4"><span data-i18n="p3_info"></span> · B 📡</h4>
            <div class="info-grid">
              <div class="value-item">
                <span class="val-label" data-i18n="p3_type"></span>
                <span class="val-number sm" id="cb-name">--</span>
                <span class="val-sub" id="cb-range">--</span>
              </div>
              <div class="value-item"><span class="val-label" data-i18n="p3_freq"></span><span class="val-number sm cyan-text" id="cb-f">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_lambda"></span><span class="val-number sm purple-text" id="cb-l">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_energy"></span><span class="val-number sm" id="cb-e">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_amp"></span><span class="val-number sm" id="cb-a">--</span></div>
              <div class="value-item"><span class="val-label" data-i18n="p3_speed"></span><span class="val-number sm">3.00 × 10⁸ <span class="val-unit">m/s</span></span></div>
            </div>
          </div>

        </div>
          <div class="cmp-warn" id="note-cmp" hidden>
            <span>⚠️</span>
            <p data-i18n="p3_note_cmp"></p>
          </div>
      </div>

        <div class="sub-card">
          <p class="text-sm" data-i18n="p3_note"></p>
          <p class="text-sm" data-i18n="p3_note_f"></p>
        </div>
      <div class="sub-card p3-scroll" id="cmp-table" hidden></div>

    </article>

    <!-- BOX 3: METER KEAMANAN -->
    <article class="p2-box" id="box-safety">
      <h3 class="p2-box-title orange-text" data-i18n="p3_safety"></h3>
      <div class="sub-card">
        <div class="meter"><div class="meter-bar"></div><div class="meter-tick" id="meter-tick"><span data-i18n="p3_ion"></span></div><div class="spec-mark" id="meter-mark"></div></div>
        <div class="p3-arrows"><span data-i18n="lv0"></span><span data-i18n="lv1"></span><span data-i18n="lv3"></span></div>
        <div id="safe-box" class="safe-box text-lg"></div>
        <p class="text-sm" data-i18n="p3_safe_hint"></p>
      </div>
    </article>

    <!-- BOX 4: CONTOH NYATA -->
    <article class="p2-box" id="box-ex">
      <h3 class="p2-box-title cyan-text" data-i18n="p3_ex"></h3>
      <div class="sub-card"><div id="ex-list"></div></div>
    </article>

    <div class="bottom-nav">
      <button class="btn-text" data-goto="2" data-i18n="p3_back"></button>
      <div class="pagination">
        <span class="dot active" data-goto="1">1</span><span class="line"></span>
        <span class="dot active" data-goto="2">2</span><span class="line"></span>
        <span class="dot active current" data-goto="3">3</span><span class="line dim"></span>
        <span class="dot dim" data-goto="4">4</span>
      </div>
      <button class="btn-text" data-goto="4" data-i18n="p3_next"></button>
    </div>
  </div>
</section>
